# Produktion hinter Nginx Proxy Manager (Standard) oder optional Caddy am Host.
# NPM:  docker compose -f docker-compose.prod.yml up -d --build
# IPv6 direkt an der VM:  dasselbe plus --profile edge

name: nexaly

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexaly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nexaly}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexaly} -d ${POSTGRES_DB:-nexaly}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nexaly]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [nexaly]

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
    working_dir: /app/packages/database
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    restart: "no"
    networks: [nexaly]

  # Einmalig: Besitzrechte am Upload-Volume korrigieren (älteres Volume gehört root).
  uploads-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    user: root
    command: ["sh", "-c", "chown -R nexaly:nexaly /app/uploads"]
    volumes:
      - uploads:/app/uploads
    restart: "no"
    networks: [nexaly]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      PUBLIC_WEB_URL: https://nexaly.app
      DISCORD_REDIRECT_URI: https://nexaly.app/api/auth/discord/callback
      ASSET_DIR: /app/uploads
    # Gleiches Volume wie der Worker: API speichert Uploads, Worker rendert daraus die Karten.
    volumes:
      - uploads:/app/uploads
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [nexaly]

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [nexaly]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      ASSET_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [nexaly]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PUBLIC_API_URL: http://api:3001
      PUBLIC_WEB_URL: https://nexaly.app
    depends_on:
      - api
    networks: [nexaly]
    ports:
      # Läuft der Reverse-Proxy (NPM/Caddy) auf derselben VM, WEB_BIND=127.0.0.1 in .env setzen –
      # dann ist das Dashboard nicht mehr am Proxy vorbei per http://<IP>:3000 erreichbar.
      # Achtung: Docker-Ports umgehen ufw, eine Firewall-Regel allein reicht nicht.
      - "${WEB_BIND:-0.0.0.0}:3000:3000"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    profiles: ["edge"]
    network_mode: host
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

networks:
  nexaly:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
