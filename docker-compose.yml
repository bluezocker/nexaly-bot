services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexaly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexaly}
      POSTGRES_DB: ${POSTGRES_DB:-nexaly}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexaly} -d ${POSTGRES_DB:-nexaly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]
    command: ["pnpm", "--filter", "@nexaly/database", "exec", "prisma", "migrate", "deploy"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["app"]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    env_file: .env
    environment:
      API_URL: ${PUBLIC_API_URL:-http://api:3001}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    profiles: ["app"]

volumes:
  pgdata:
  redisdata:
  uploads:
